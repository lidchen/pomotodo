<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomotodo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-orange-50 via-amber-50 to-yellow-50 transition-colors duration-1000">
    <div id="auth-container" class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="auth-card bg-white rounded-3xl shadow-2xl p-8 md:p-12 max-w-md w-full transition-all duration-500">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">🍅</div>
                <h1 class="text-4xl md:text-5xl font-cursive text-amber-700 mb-2">Pomotodo</h1>
                <p class="text-gray-500">Focus on moments and achieve efficiency</p>
            </div>

            <div id="auth-form-container">
                <form id="login-form" class="space-y-6">
                    <h2 class="text-2xl font-cursive text-gray-800 text-center mb-6">Login</h2>
                    
                    <div class="space-y-2">
                        <label for="login-username" class="block text-sm text-gray-600 font-medium">Username</label>
                        <div class="relative">
                            <input type="text" id="login-username" class="auth-input w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 transition-all duration-300" placeholder="Please enter your username" autocomplete="username">
                            <span id="login-username-error" class="error-message text-red-500 text-sm mt-1 hidden"></span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="login-password" class="block text-sm text-gray-600 font-medium">Password</label>
                        <div class="relative">
                            <input type="password" id="login-password" class="auth-input w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 transition-all duration-300" placeholder="Please enter your password" autocomplete="current-password">
                            <span id="login-password-error" class="error-message text-red-500 text-sm mt-1 hidden"></span>
                        </div>
                    </div>

                    <div id="login-error" class="error-alert bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl hidden">
                        <span id="login-error-text"></span>
                    </div>

                    <button type="submit" id="login-btn" class="auth-btn w-full px-8 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-full font-medium transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                        <span id="login-btn-text">Login</span>
                        <span id="login-btn-loading" class="hidden">
                            <svg class="animate-spin h-5 w-5 inline-block mr-2" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            logining in...
                        </span>
                    </button>
                </form>

                <form id="register-form" class="space-y-6 hidden">
                    <h2 class="text-2xl font-cursive text-gray-800 text-center mb-6">Register</h2>

                    <div class="space-y-2">
                        <label for="register-username" class="block text-sm text-gray-600 font-medium">Username</label>
                        <div class="relative">
                            <input type="text" id="register-username" class="auth-input w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 transition-all duration-300" placeholder="Please enter your username (4-20 characters)" autocomplete="username">
                            <span id="register-username-error" class="error-message text-red-500 text-sm mt-1 hidden"></span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="register-password" class="block text-sm text-gray-600 font-medium">Password</label>
                        <div class="relative">
                            <input type="password" id="register-password" class="auth-input w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 transition-all duration-300" placeholder="Please enter your password (at least 6 characters)" autocomplete="new-password">
                            <span id="register-password-error" class="error-message text-red-500 text-sm mt-1 hidden"></span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="register-confirm-password" class="block text-sm text-gray-600 font-medium">Confirm Password</label>
                        <div class="relative">
                            <input type="password" id="register-confirm-password" class="auth-input w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 transition-all duration-300" placeholder="Please enter your password again" autocomplete="new-password">
                            <span id="register-confirm-password-error" class="error-message text-red-500 text-sm mt-1 hidden"></span>
                        </div>
                    </div>

                    <div id="register-error" class="error-alert bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl hidden">
                        <span id="register-error-text"></span>
                    </div>

                    <button type="submit" id="register-btn" class="auth-btn w-full px-8 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-full font-medium transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                        <span id="register-btn-text">Register</span>
                        <span id="register-btn-loading" class="hidden">
                            <svg class="animate-spin h-5 w-5 inline-block mr-2" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            logining in...
                        </span>
                    </button>
                </form>

                <div class="mt-8 text-center">
                    <p class="text-gray-500">
                        <span id="auth-switch-text">Don't have an account?</span>
                        <button id="auth-switch-btn" class="text-amber-500 hover:text-amber-600 font-medium transition-colors duration-300 ml-1">
                            <span id="auth-switch-btn-text">Sign up now</span>
                        </button>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="container mx-auto px-4 py-8 max-w-7xl">
            <header class="text-center mb-8 flex items-center justify-between">
                <div></div>
                <h1 class="text-4xl md:text-5xl font-cursive text-amber-700 mb-2">Pomotodo Timer</h1>
                <button id="logout-btn" class="px-4 py-2 text-gray-500 hover:text-gray-700 transition-colors duration-300 text-sm">
                    Logout
                </button>
            </header>

            <main class="flex flex-col gap-8 max-w-4xl mx-auto">
                <section class="w-full">
                    <div class="bg-white rounded-3xl shadow-lg p-8 transition-all duration-500">
                        <div id="timer-container" class="text-center">
                            <div id="task-display" class="mb-6">
                                <p class="text-sm text-gray-500 mb-2">Current Task</p>
                                <h2 id="current-task-title" class="text-xl font-medium text-gray-700 min-h-[2rem]">Choose or create a task to start focusing</h2>
                            </div>

                            <div id="timer-display" class="mb-8">
                                <div id="timer" class="text-7xl md:text-9xl font-cursive text-gray-800 tracking-wider">01:00</div>
                                <p id="phase-label" class="phase-label focus text-lg mt-2">Focusing</p>
                            </div>

                            <div id="controls" class="flex flex-wrap justify-center gap-4">
                                <button id="start-pause-btn" class="px-8 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-full font-medium transition-all duration-300 shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                                    Start Focus
                                </button>
                                <button id="skip-btn" class="px-8 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-full font-medium transition-all duration-300">
                                    Skip
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <aside class="w-full">
                    <div class="bg-white rounded-3xl shadow-lg p-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-2xl font-cursive text-gray-800">Task List</h3>
                            <div class="flex items-center gap-3">
                                <button id="delete-completed-btn" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-full text-sm font-medium transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
                                    Delete Completed
                                </button>
                                <button id="add-task-btn" class="w-10 h-10 bg-amber-500 hover:bg-amber-600 text-white rounded-full flex items-center justify-center text-2xl transition-all duration-300 shadow-md hover:shadow-lg">
                                    +
                                </button>
                            </div>
                        </div>

                        <div id="task-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                        </div>

                        <div id="empty-state" class="text-center py-12 text-gray-400">
                            <div class="text-6xl mb-4">🍅</div>
                            <p>No tasks yet</p>
                            <p class="text-sm mt-1">Click + to add your first task</p>
                        </div>
                    </div>
                </aside>
            </main>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div id="modal" class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 transform scale-95 opacity-0 transition-all duration-300">
            <h3 id="modal-title" class="text-2xl font-cursive text-gray-800 mb-6 text-center"></h3>
            <div id="modal-content" class="mb-6">
            </div>
            <div id="modal-buttons" class="flex gap-4 justify-center">
            </div>
        </div>
    </div>

    <div id="add-task-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-cursive text-gray-800 mb-6 text-center">Add New Task</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-2">Task Title</label>
                    <textarea id="new-task-title" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 resize-none" rows="3" placeholder="Enter task content..."></textarea>
                </div>
            </div>
            <div class="flex gap-4 justify-center mt-8">
                <button id="cancel-add-task" class="px-8 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-full font-medium transition-all duration-300">
                    Cancel
                </button>
                <button id="confirm-add-task" class="px-8 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-full font-medium transition-all duration-300 shadow-md hover:shadow-lg">
                    Add Task
                </button>
            </div>
        </div>
    </div>

    <div id="edit-task-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-cursive text-gray-800 mb-6 text-center">Edit Task</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-2">Task Title</label>
                    <textarea id="edit-task-title" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 resize-none" rows="3" placeholder="输入任务内容..."></textarea>
                </div>
            </div>
            <div class="flex gap-4 justify-center mt-8">
                <button id="cancel-edit-task" class="px-8 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-full font-medium transition-all duration-300">
                    concel
                </button>
                <button id="confirm-edit-task" class="px-8 py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-full font-medium transition-all duration-300 shadow-md hover:shadow-lg">
                    save
                </button>
            </div>
        </div>
    </div>

    <audio id="focus-end-sound" preload="auto"></audio>
    <audio id="break-end-sound" preload="auto"></audio>

    <script src="../api/config.js"></script>
    <script src="../api/apiClient.js"></script>
    <script src="../api/authService.js"></script>
    <script src="../api/todoService.js"></script>
    <script src="js/errors.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
